# benchmarks/case-anchors.yaml
#
# Empirical anchor data extracted from Tier-1 case studies (6 projects, 2-6 month
# explosive-growth cohort, captured 2026-04-27). This file is NOT a-priori threshold
# rules — those live in benchmarks/<dim>.md. This file is observed-percentile data
# usable by the scoring engine to answer:
#   "How does this repo compare against breakout cohort P50 / P75?"
#
# Hard rules:
# 1. Every metric here must trace to a case-study source path.
# 2. UNVERIFIED entries are marked explicitly; never silently zero-filled.
# 3. Recompute by re-running tools/scorecard-run + indexer; do not hand-edit.
# 4. Scoring engine must NOT use these anchors as thresholds without an explicit
#    rubric mapping in benchmarks/<dim>.md (anchors inform; rubrics decide).

meta:
  version: 0.1.0
  status: draft
  cohort: tier1-explosive-2-6mo
  cohort_size: 6
  capture_date: "2026-04-27"
  growth_class: explosive
  cohort_window_months: [2, 6]
  source_inventory:
    - case-studies/openclaw.md
    - case-studies/everything-claude-code.md
    - case-studies/andrej-karpathy-skills.md
    - case-studies/mirofish.md
    - case-studies/oh-my-openagent.md
    - case-studies/worldmonitor.md
  comparison_matrix: research/tier1-comparison-matrix.md

